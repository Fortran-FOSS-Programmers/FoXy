name = "FoXy"
version = "0.8.1"
author = "Stefano Zaghi"
copyright = "Copyright © 2016, Stefano Zaghi"
license = "Multiple licenses"
description = "Fortran XML parser for poor people"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/Fortran-FOSS-Programmers/FoXy"

[library]
source-dir = "src/lib"

[install]
library = true

[dependencies]
[dependencies.StringiFor]
git = "https://github.com/szaghi/StringiFor"

[dependencies.PENF]
git = "https://github.com/szaghi/PENF"

# the tests live in src/tests (not fpm's test/): each one declared, run by `fpm test` from the project root
# (they read src/tests/data); a new src/tests/foxy_test_*.f90 needs an entry here
[build]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "foxy_test_add_attributes"
source-dir = "src/tests"
main = "foxy_test_add_attributes.f90"

