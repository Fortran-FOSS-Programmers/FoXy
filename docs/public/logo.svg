<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FoXy">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1e2a38"/>
  <!-- the head: two ears and a muzzle pointing down, the shape of a fox and of the brackets of a tag -->
