  <path d="M13 17 L21 22.5 L15 28 Z M51 17 L43 22.5 L49 28 Z" fill="#1e2a38" opacity="0.55"/>
  <!-- the white cheeks, a V meeting at the nose -->
  <path d="M12 34 L24 33 L32 42 L40 33 L52 34 L32 54 Z" fill="#fff4ea"/>
  <!-- the eyes, < and >: the markup in the face -->
  <path d="M26 26 L20.5 29 L26 32" fill="none" stroke="#1e2a38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 26 L43.5 29 L38 32" fill="none" stroke="#1e2a38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="50" r="2.6" fill="#1e2a38"/>
</svg>
